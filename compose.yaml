services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      DATABASE_PATH: /app/data/voltmart.sqlite
      TRUST_PROXY: '1'
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - store-data:/app/data
    logging:
      options:
        max-size: '10m'
        max-file: '3'
volumes:
  store-data:
